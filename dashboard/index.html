<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite 20 提交数据仪表盘</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.gradient-bg { background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%); }
.matrix-cell { transition: all 0.2s; cursor: pointer; }
.matrix-cell:hover { transform: scale(1.1); z-index: 10; }
.status-complete { background: #10b981; }
.status-partial { background: #f59e0b; }
.status-missing { background: #ef4444; }
.fade-in { animation: fadeIn 0.3s ease-in; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.tab-active { background: #1e3a5f; color: white; }
</style>
</head>
<body class="bg-gray-100 min-h-screen">

<header class="gradient-bg text-white py-6 px-4">
  <div class="max-w-7xl mx-auto">
    <h1 class="text-2xl md:text-3xl font-bold flex items-center gap-2">📊 Elite 20 提交数据仪表盘</h1>
    <p class="text-white/70 mt-1">实时追踪全班提交进度 · 数据更新于 2026-09-30 20:05:38</p>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">

  <!-- Stats Cards -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
    <div class="bg-white rounded-xl p-4 shadow">
      <div class="text-3xl font-bold text-blue-600" id="statStudents">0</div>
      <div class="text-sm text-gray-500">学生总数</div>
    </div>
    <div class="bg-white rounded-xl p-4 shadow">
      <div class="text-3xl font-bold text-purple-600" id="statChallenges">0</div>
      <div class="text-sm text-gray-500">挑战总数</div>
    </div>
    <div class="bg-white rounded-xl p-4 shadow">
      <div class="text-3xl font-bold text-green-600" id="statRate">0%</div>
      <div class="text-sm text-gray-500">整体完成率</div>
    </div>
    <div class="bg-white rounded-xl p-4 shadow">
      <div class="text-3xl font-bold text-red-500" id="statMissing">0</div>
      <div class="text-sm text-gray-500">缺失提交</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="flex gap-2 mb-6 bg-white p-2 rounded-xl shadow">
    <button onclick="switchTab('overview')" id="tab-overview" class="tab-active flex-1 py-2 px-4 rounded-lg font-medium transition">📈 总览</button>
    <button onclick="switchTab('matrix')" id="tab-matrix" class="flex-1 py-2 px-4 rounded-lg font-medium transition hover:bg-gray-100">🔲 提交矩阵</button>
    <button onclick="switchTab('students')" id="tab-students" class="flex-1 py-2 px-4 rounded-lg font-medium transition hover:bg-gray-100">👤 按学生</button>
    <button onclick="switchTab('challenges')" id="tab-challenges" class="flex-1 py-2 px-4 rounded-lg font-medium transition hover:bg-gray-100">🎯 按挑战</button>
  </div>

  <!-- Overview Tab -->
  <div id="view-overview" class="fade-in">
    <div class="grid md:grid-cols-2 gap-6 mb-6">
      <div class="bg-white rounded-xl p-6 shadow">
        <h3 class="font-bold text-gray-800 mb-4">提交状态分布</h3>
        <canvas id="pieChart" height="200"></canvas>
      </div>
      <div class="bg-white rounded-xl p-6 shadow">
        <h3 class="font-bold text-gray-800 mb-4">各挑战完成率</h3>
        <canvas id="barChart" height="200"></canvas>
      </div>
    </div>
    <div class="bg-white rounded-xl p-6 shadow mb-6">
      <h3 class="font-bold text-gray-800 mb-4">学生完成率排名</h3>
      <canvas id="studentChart" height="100"></canvas>
    </div>
  </div>

  <!-- Matrix Tab -->
  <div id="view-matrix" class="hidden fade-in">
    <div class="bg-white rounded-xl p-6 shadow overflow-x-auto">
      <h3 class="font-bold text-gray-800 mb-4">学生 × 挑战 提交矩阵</h3>
      <div class="flex gap-4 mb-4 text-sm">
        <span class="flex items-center gap-1"><span class="w-4 h-4 rounded status-complete"></span>完整</span>
        <span class="flex items-center gap-1"><span class="w-4 h-4 rounded status-partial"></span>部分</span>
        <span class="flex items-center gap-1"><span class="w-4 h-4 rounded status-missing"></span>缺失</span>
      </div>
      <div id="matrixContainer"></div>
    </div>
  </div>

  <!-- Students Tab -->
  <div id="view-students" class="hidden fade-in">
    <div class="bg-white rounded-xl p-6 shadow">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-gray-800">学生提交详情</h3>
        <select id="studentFilter" onchange="renderStudentDetail()" class="px-3 py-2 border rounded-lg text-sm">
          <option value="">全部学生</option>
        </select>
      </div>
      <div id="studentList" class="space-y-3"></div>
    </div>
  </div>

  <!-- Challenges Tab -->
  <div id="view-challenges" class="hidden fade-in">
    <div class="bg-white rounded-xl p-6 shadow">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-gray-800">挑战提交详情</h3>
        <select id="challengeFilter" onchange="renderChallengeDetail()" class="px-3 py-2 border rounded-lg text-sm">
          <option value="">全部挑战</option>
        </select>
      </div>
      <div id="challengeList" class="space-y-3"></div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detailModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-2xl w-full max-h-[80vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold" id="modalTitle">详情</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
      </div>
      <div id="modalContent"></div>
    </div>
  </div>

</main>

<footer class="bg-gray-800 text-white py-4 px-4 mt-8 text-center text-sm text-gray-400">
  Elite 20 Submission Dashboard | 数据仅供课程管理使用 | 生成时间 2026-09-30 20:05:38
</footer>

let pieChart, barChart, studentChart;

// ==================== Init ====================
function init() {
  document.getElementById('statStudents').textContent = DATA.total_students;
  document.getElementById('statChallenges').textContent = DATA.total_challenges;
  
  const complete = DATA.submissions.filter(s => s.status === 'complete').length;
  const partial = DATA.submissions.filter(s => s.status === 'partial').length;
  const missing = DATA.submissions.filter(s => s.status === 'missing').length;
  document.getElementById('statRate').textContent = Math.round(complete / DATA.total_submissions * 100) + '%';
  document.getElementById('statMissing').textContent = missing;

  // Populate filters
  const studentFilter = document.getElementById('studentFilter');
  DATA.students.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.name; opt.textContent = s.name + ' (' + s.major + ')';
    studentFilter.appendChild(opt);
  });
  const challengeFilter = document.getElementById('challengeFilter');
  Object.entries(DATA.challenges).forEach(([id, c]) => {
    const opt = document.createElement('option');
    opt.value = id; opt.textContent = id + ' - ' + c.title;
    challengeFilter.appendChild(opt);
  });

  renderCharts();
  renderMatrix();
  renderStudentList();
  renderChallengeList();
}

// ==================== Charts ====================
function renderCharts() {
  const complete = DATA.submissions.filter(s => s.status === 'complete').length;
  const partial = DATA.submissions.filter(s => s.status === 'partial').length;
  const missing = DATA.submissions.filter(s => s.status === 'missing').length;

  pieChart = new Chart(document.getElementById('pieChart'), {
    type: 'doughnut',
    data: {
      labels: ['完整', '部分', '缺失'],
      datasets: [{ data: [complete, partial, missing], backgroundColor: ['#10b981', '#f59e0b', '#ef4444'] }]
    },
    options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
  });

  const cids = Object.keys(DATA.challenges);
  const rates = cids.map(cid => {
    const subs = DATA.submissions.filter(s => s.challenge === cid);
    const comp = subs.filter(s => s.status === 'complete').length;
    return Math.round(comp / subs.length * 100);
  });

  barChart = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels: cids,
      datasets: [{ label: '完成率(%)', data: rates, backgroundColor: '#3b82f6', borderRadius: 6 }]
    },
    options: { responsive: true, scales: { y: { beginAtZero: true, max: 100 } }, plugins: { legend: { display: false } } }
  });

  const studentRates = DATA.students.map(st => {
    const subs = DATA.submissions.filter(s => s.student.name === st.name);
    const comp = subs.filter(s => s.status === 'complete').length;
    return { name: st.name, rate: Math.round(comp / subs.length * 100) };
  }).sort((a, b) => b.rate - a.rate);

  studentChart = new Chart(document.getElementById('studentChart'), {
    type: 'bar',
    data: {
      labels: studentRates.map(s => s.name),
      datasets: [{ label: '完成率(%)', data: studentRates.map(s => s.rate),
        backgroundColor: studentRates.map(s => s.rate >= 70 ? '#10b981' : s.rate >= 40 ? '#f59e0b' : '#ef4444'), borderRadius: 4 }]
    },
    options: { indexAxis: 'y', responsive: true, scales: { x: { beginAtZero: true, max: 100 } }, plugins: { legend: { display: false } } }
  });
}

// ==================== Matrix ====================
function renderMatrix() {
  const cids = Object.keys(DATA.challenges);
  let html = '<table class="w-full text-sm border-collapse"><thead><tr><th class="p-2 text-left bg-gray-50 sticky left-0">学生</th>';
  cids.forEach(cid => { html += '<th class="p-2 text-center bg-gray-50">' + cid + '</th>'; });
  html += '<th class="p-2 text-center bg-gray-50">完成率</th></tr></thead><tbody>';
  
  DATA.students.forEach(st => {
    html += '<tr class="border-b"><td class="p-2 font-medium sticky left-0 bg-white">' + st.name + '</td>';
    let compCount = 0;
    cids.forEach(cid => {
      const sub = DATA.submissions.find(s => s.student.name === st.name && s.challenge === cid);
      const cls = sub ? 'status-' + sub.status : 'status-missing';
      const label = sub ? (sub.status === 'complete' ? '✓' : sub.status === 'partial' ? '!' : '✗') : '✗';
      html += '<td class="p-1 text-center"><div class="matrix-cell ' + cls + ' text-white w-8 h-8 rounded flex items-center justify-center mx-auto text-xs font-bold" onclick="showDetail(\'' + st.name + '\',\'' + cid + '\')">' + label + '</div></td>';
      if (sub && sub.status === 'complete') compCount++;
    });
    const rate = Math.round(compCount / cids.length * 100);
    html += '<td class="p-2 text-center font-bold" style="color:' + (rate >= 70 ? '#10b981' : rate >= 40 ? '#f59e0b' : '#ef4444') + '">' + rate + '%</td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('matrixContainer').innerHTML = html;
}

// ==================== Student List ====================
function renderStudentList() {
  const filter = document.getElementById('studentFilter').value;
  const container = document.getElementById('studentList');
  let students = DATA.students;
  if (filter) students = students.filter(s => s.name === filter);
  
  container.innerHTML = students.map(st => {
    const subs = DATA.submissions.filter(s => s.student.name === st.name);
    const comp = subs.filter(s => s.status === 'complete').length;
    const rate = Math.round(comp / subs.length * 100);
    const missingList = subs.filter(s => s.status !== 'complete').map(s => s.challenge + (s.status === 'partial' ? '(部分)' : '(缺失)')).join(', ');
    return '<div class="border rounded-lg p-4 hover:shadow-md transition cursor-pointer" onclick="showStudentDetail(\'' + st.name + '\')">' +
      '<div class="flex justify-between items-center">' +
        '<div><span class="font-bold text-lg">' + st.name + '</span> <span class="text-sm text-gray-500">' + st.major + '</span></div>' +
        '<span class="px-3 py-1 rounded-full text-sm font-bold" style="background:' + (rate >= 70 ? '#d1fae5;color:#065f46' : rate >= 40 ? '#fef3c7;color:#92400e' : '#fee2e2;color:#991b1b') + '">' + rate + '%</span>' +
      '</div>' +
      '<div class="text-sm text-gray-600 mt-2">完成 ' + comp + '/' + subs.length + ' 个挑战' + (missingList ? ' · 待完成: ' + missingList : '') + '</div>' +
    '</div>';
  }).join('');
}

function renderStudentDetail() { renderStudentList(); }

// ==================== Challenge List ====================
function renderChallengeList() {
  const filter = document.getElementById('challengeFilter').value;
  const container = document.getElementById('challengeList');
  let entries = Object.entries(DATA.challenges);
  if (filter) entries = entries.filter(([id]) => id === filter);
  
  container.innerHTML = entries.map(([cid, chal]) => {
    const subs = DATA.submissions.filter(s => s.challenge === cid);
    const comp = subs.filter(s => s.status === 'complete').length;
    const partial = subs.filter(s => s.status === 'partial').length;
    const missing = subs.filter(s => s.status === 'missing').length;
    const rate = Math.round(comp / subs.length * 100);
    return '<div class="border rounded-lg p-4 hover:shadow-md transition cursor-pointer" onclick="showChallengeDetail(\'' + cid + '\')">' +
      '<div class="flex justify-between items-center">' +
        '<div><span class="font-bold text-lg">' + cid + '</span> <span class="text-sm text-gray-500">' + chal.title + '</span></div>' +
        '<span class="px-3 py-1 rounded-full text-sm font-bold" style="background:' + (rate >= 70 ? '#d1fae5;color:#065f46' : rate >= 40 ? '#fef3c7;color:#92400e' : '#fee2e2;color:#991b1b') + '">' + rate + '%</span>' +
      '</div>' +
      '<div class="text-sm text-gray-600 mt-2">✓ 完整 ' + comp + ' · ⚠ 部分 ' + partial + ' · ✗ 缺失 ' + missing + '</div>' +
    '</div>';
  }).join('');
}

function renderChallengeDetail() { renderChallengeList(); }

// ==================== Modal ====================
function showDetail(studentName, challengeId) {
  const sub = DATA.submissions.find(s => s.student.name === studentName && s.challenge === challengeId);
  if (!sub) return;
  document.getElementById('modalTitle').textContent = studentName + ' - ' + challengeId;
  const statusLabel = {complete: '✅ 完整', partial: '⚠️ 部分', missing: '❌ 缺失'}[sub.status];
  let filesHtml = sub.files.map(f => 
    '<div class="flex items-center gap-2 py-1 ' + (f.present ? '' : 'text-red-500') + '">' +
    (f.present ? '✅' : '❌') + ' <span class="text-sm">' + f.filename + '</span></div>'
  ).join('');
  document.getElementById('modalContent').innerHTML = 
    '<div class="space-y-3">' +
    '<p><span class="font-medium">状态:</span> ' + statusLabel + '</p>' +
    '<p><span class="font-medium">提交时间:</span> ' + (sub.submitted_at || '未提交') + '</p>' +
    '<p><span class="font-medium">完成度:</span> ' + (sub.completeness * 100).toFixed(0) + '%</p>' +
    '<p><span class="font-medium">达到等级:</span> Level ' + sub.level_achieved + '</p>' +
    (sub.notes ? '<p><span class="font-medium">备注:</span> ' + sub.notes + '</p>' : '') +
    '<div class="mt-3"><span class="font-medium">文件清单:</span>' + filesHtml + '</div>' +
    '</div>';
  document.getElementById('detailModal').classList.remove('hidden');
}

function showStudentDetail(name) {
  const st = DATA.students.find(s => s.name === name);
  const subs = DATA.submissions.filter(s => s.student.name === name);
  document.getElementById('modalTitle').textContent = name + ' 的全部提交';
  let html = '<p class="mb-3 text-gray-600">专业: ' + st.major + ' · GitHub: ' + st.github + '</p>';
  html += '<div class="space-y-2">';
  subs.forEach(sub => {
    const color = {complete: '#10b981', partial: '#f59e0b', missing: '#ef4444'}[sub.status];
    html += '<div class="flex items-center gap-3 p-2 rounded bg-gray-50">' +
      '<span style="background:' + color + '" class="text-white px-2 py-0.5 rounded text-xs font-bold">' + sub.challenge + '</span>' +
      '<span class="text-sm flex-1">' + sub.challenge_title + '</span>' +
      '<span class="text-sm">' + (sub.completeness * 100).toFixed(0) + '%</span>' +
    '</div>';
  });
  html += '</div>';
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('detailModal').classList.remove('hidden');
}

function showChallengeDetail(cid) {
  const chal = DATA.challenges[cid];
  const subs = DATA.submissions.filter(s => s.challenge === cid);
  document.getElementById('modalTitle').textContent = cid + ' - ' + chal.title;
  const comp = subs.filter(s => s.status === 'complete').length;
  let html = '<p class="mb-3 text-gray-600">必填文件: ' + chal.required.join(', ') + '</p>';
  html += '<p class="mb-3">完成率: ' + Math.round(comp/subs.length*100) + '% (' + comp + '/' + subs.length + ')</p>';
  html += '<div class="space-y-2">';
  subs.forEach(sub => {
    const color = {complete: '#10b981', partial: '#f59e0b', missing: '#ef4444'}[sub.status];
    const label = {complete: '✅', partial: '⚠️', missing: '❌'}[sub.status];
    html += '<div class="flex items-center gap-3 p-2 rounded bg-gray-50">' +
      '<span>' + label + '</span>' +
      '<span class="font-medium flex-1">' + sub.student.name + '</span>' +
      '<span class="text-sm text-gray-500">' + (sub.submitted_at ? sub.submitted_at.substring(0,10) : '未提交') + '</span>' +
      '<span style="color:' + color + '" class="text-sm font-bold">' + (sub.completeness*100).toFixed(0) + '%</span>' +
    '</div>';
  });
  html += '</div>';
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('detailModal').classList.remove('hidden');
}

function closeModal() { document.getElementById('detailModal').classList.add('hidden'); }

// ==================== Tabs ====================
function switchTab(tab) {
  ['overview','matrix','students','challenges'].forEach(t => {
    document.getElementById('view-' + t).classList.add('hidden');
    document.getElementById('tab-' + t).classList.remove('tab-active');
  });
  document.getElementById('view-' + tab).classList.remove('hidden');
  document.getElementById('tab-' + tab).classList.add('tab-active');
}

// Click outside modal to close
document.getElementById('detailModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

init();
</script>
